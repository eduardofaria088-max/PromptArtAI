name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Instalar Dependencias, Java 17 e Capacitor
        run: |
          echo "Atualizando sistema e instalando Java JDK 17..."
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk nodejs npm
          
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          java -version

          echo "Instalando Capacitor..."
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "PromptArt AI" "com.promptart.app" --web-dir .
          npx cap add android
          npx cap sync android
          
          echo "Compilando APK com Gradle..."
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar o APK
        uses: actions/upload-artifact@v4
        with:
          name: PromptArt-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
