name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Codigo via Git Nativo
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout main

      - name: Instalar Dependencias, Java 21 e Capacitor
        run: |
          echo "Atualizando sistema e instalando Java JDK 21..."
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk nodejs npm
          
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          java -version

          echo "Criando pasta web e instalando Capacitor..."
          mkdir -p www
          echo "<html><body><h1>PromptArt AI</h1></body></html>" > www/index.html

          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "PromptArt AI" "com.promptart.app" --web-dir www
          npx cap add android
          npx cap sync android
          
          echo "Compilando APK com Gradle..."
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar o APK
        uses: actions/upload-artifact@v4
        with:
          name: PromptArt-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
